name: Offline runtime layout

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /build/windows-runtime-manifest.json
            /build/windows-runtime-sources.json
            /build/osgeo4w-v1-package-lock.json
            /etc/setup/installed.db
            /FHAST/developer_scripts/check_runtime_sources.py
            /FHAST/developer_scripts/check_osgeo4w_package_lock.py
            /FHAST/developer_scripts/fetch_runtime_artifacts.py
            /FHAST/developer_scripts/extract_runtime_artifacts.py
            /FHAST/developer_scripts/assemble_runtime_layout.py
            /FHAST/developer_scripts/test_runtime_layout.py
      - name: Test synthetic layout with networking disabled
        run: |
          sudo unshare --net python3 FHAST/developer_scripts/test_runtime_layout.py
